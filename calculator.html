<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <main>
      <h1 class="name">calculator</h1>
      <input class="input" type="text" />
      <div class="buttons">
        <button class="operator">+</button>
        <button class="operator">-</button>
        <button class="operator">÷</button>
        <button class="operator">%</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>0</button>
        <button class="operator">⌫</button>
        <button class="operator">=</button>
      </div>
    </main>
    <script src="calculator.js"></script>
  </body>
</html>
